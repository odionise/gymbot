<script>
const items=__CHOICE_ITEMS__;let selected=0;const options=document.getElementById('options');function render(){options.innerHTML=items.map((it,i)=>`<button type="button" aria-pressed="${selected===i}" class="option ${selected===i?'selected':''}" data-index="${i}"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true">${it.icon}</svg></span><span class="info"><b>${it.title}</b><small>${it.count}</small></span><span class="check"><svg viewBox="0 0 24 24"><path d="m3 12 6 6L21 6"/></svg></span></button>`).join('');options.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{selected=Number(b.dataset.index);render()}))}const track=document.getElementById('slideStart');
const thumb=document.getElementById('slideThumb');
const fill=document.getElementById('slideFill');
const caption=document.getElementById('slideCaption');
let isLight=false;const lightToggle=document.getElementById('lightToggle');const lightHint=document.getElementById('lightHint');lightToggle.addEventListener('click',()=>{if(completed)return;isLight=!isLight;lightToggle.setAttribute('aria-pressed',String(isLight));lightHint.classList.toggle('active',isLight)});
let dragging=false, pointerStart=0, startOffset=0, currentOffset=0, completed=false;
function limit(){return Math.max(0,track.clientWidth-thumb.offsetWidth-10)}
function setSlide(x, immediate=false){currentOffset=Math.max(0,Math.min(limit(),x));thumb.style.left=(5+currentOffset)+'px';fill.style.width=(currentOffset+thumb.offsetWidth+10)+'px';caption.style.opacity=String(Math.max(0.10,1-currentOffset/Math.max(1,limit())));}
function reset(){track.classList.remove('dragging');thumb.style.left='5px';fill.style.width='0px';caption.style.opacity='1';currentOffset=0;}
function launch(){
  if(completed||!items.length)return;
  completed=true;track.classList.add('done');
  thumb.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4 10-10"/></svg>';
  caption.textContent='Поехали!';
  caption.style.opacity='1';
  const chosen=items[selected];const untracked=isLight;
  // Browser preview only: production bot must receive a confirmed event,
  // create the workout widget, then delete the old Telegram message.
  setTimeout(()=>parent.postMessage({source:'one-rep',type:'start',templateId:chosen.id,light:untracked},'*'),850);
}
thumb.addEventListener('pointerdown',e=>{
  if(completed)return;
  dragging=true;pointerStart=e.clientX;startOffset=currentOffset;
  track.classList.add('dragging');thumb.setPointerCapture(e.pointerId);e.preventDefault();
});
thumb.addEventListener('pointermove',e=>{
  if(!dragging||completed)return;
  setSlide(startOffset+e.clientX-pointerStart);
});
function finish(e){
  if(!dragging||completed)return;
  dragging=false;track.classList.remove('dragging');
  if(currentOffset>=limit()*.94){setSlide(limit());launch()}
  else reset();
}
thumb.addEventListener('pointerup',finish);
thumb.addEventListener('pointercancel',()=>{dragging=false;reset()});
// Keyboard accessibility: focus knob, press Enter/Space to confirm deliberately.
thumb.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!completed){e.preventDefault();setSlide(limit());launch()}});
render();if(!items.length){thumb.disabled=true;track.setAttribute('aria-label','Сначала создайте тренировку в программе');}
</script>
