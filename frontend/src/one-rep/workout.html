<script>
const dumbbellIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 9v6M5 7v10M19 7v10M22 9v6M5 12h14"/></svg>';
const checks='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 12.5l3.4 3.4L17.5 8.3"/></svg>';
const benchSvg=`<svg viewBox="0 0 170 126" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Схема жима лёжа"><g stroke="#656571" stroke-width="2.5" stroke-linecap="round"><path d="M18 113h135M35 100l-8 13M120 100l9 13M29 90h108"/><path d="M16 34h138M25 27v15M146 27v15"/></g><g stroke="#dedee4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M56 81h50M52 81l-9-13M106 81l21 12M77 80V57M100 79l9-20M78 57l-4-15M109 59l4-17"/><circle cx="43" cy="76" r="9" fill="#282830" stroke="#dedee4"/></g><g stroke="#9d9da8" stroke-width="5" stroke-linecap="round"><path d="M65 42h16M104 42h16"/></g><path d="M65 33v18M120 33v18" stroke="#d7d7e0" stroke-width="3" stroke-linecap="round"/></svg>`;
const plans=__WORKOUT_PLANS__;
const plan=plans.map(e=>({...e}));
let opened=-1,visibleCount=plan.length,completed=false,toastTimer=0;
const list=document.getElementById('exerciseList'),progressFill=document.getElementById('progressFill'),finish=document.getElementById('finishSlide');
const activePlan=()=>plan.slice(0,visibleCount);
const total=e=>e.warm.length+e.work.length;
const doneCount=e=>[...e.warm,...e.work].filter(s=>s.done).length;
const allDone=e=>e.kind!=='strength'?e.durationDone:(e.work.length>0&&e.work.every(s=>s.done)&&e.warm.every(s=>s.done));
const fmt=n=>Number.isInteger(n)?String(n):String(n).replace('.',',');
const shortDate=raw=>{const names={января:'янв',февраля:'фев',марта:'мар',апреля:'апр',мая:'май',июня:'июн',июля:'июл',августа:'авг',сентября:'сен',октября:'окт',ноября:'ноя',декабря:'дек'};const m=String(raw).trim().toLowerCase().match(/^(\d{1,2})\s+([а-яё]+)/);return m?`${Number(m[1])} ${names[m[2]]||m[2]}`:raw};
const previousWorkMarkup=e=>{const rows=e.past.work.slice(0,5);if(!rows.length)return '<div class="previous-column"><div class="previous-outer-title">ПРОШЛАЯ ТРЕНИРОВКА</div><div class="previous-card">Нет прошлых результатов</div></div>';return `<div class="previous-column"><div class="previous-outer-title">ПРОШЛАЯ ТРЕНИРОВКА</div><div class="previous-card"><div class="previous-date">${shortDate(e.past.date)}</div><div class="previous-sets lines-${rows.length}">${rows.map((row,i)=>`<div class="previous-set-line"><span class="num">${i+1}.</span><span>${row}</span></div>`).join('')}</div></div>`};
const flash=msg=>{let el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1400)};
function setMarkup(s,i,type){return `<div class="set-row ${s.done?'done':''}"><div class="set-number">${i+1}</div>${['w','r','pdo'].map(field=>`<div class="stepper"><button type="button" data-action="step" data-dir="-1" data-type="${type}" data-i="${i}" data-field="${field}" aria-label="Уменьшить ${field==='w'?'вес':field==='r'?'повторы':'ПДО'}">−</button><input type="text" inputmode="${field==='r'?'numeric':'decimal'}" autocomplete="off" value="${fmt(s[field])}" data-set-input data-type="${type}" data-i="${i}" data-field="${field}" aria-label="${field==='w'?'Вес, кг':field==='r'?'Повторы':'ПДО'} в подходе ${i+1}" ${s.done?'readonly':''}><button type="button" data-action="step" data-dir="1" data-type="${type}" data-i="${i}" data-field="${field}" aria-label="Увеличить ${field==='w'?'вес':field==='r'?'повторы':'ПДО'}">+</button></div>`).join('')}<button class="save-check" type="button" data-action="save" data-type="${type}" data-i="${i}" aria-label="${s.done?'Снять отметку подхода':'Отметить подход выполненным'}">${checks}</button></div>`}
function sectionMarkup(e,type){const warm=type==='warm',a=e[type],canRemove=a.length>1&&!(a.at(-1)?.done);return `<div class="detail-section ${warm?'warm':'work'}"><div class="section-top"><h3>${warm?'Разминка':'Рабочие подходы'}</h3><div class="section-actions"><button class="section-action" type="button" data-action="remove" data-type="${type}" ${canRemove?'':'disabled'} aria-label="Удалить последний подход">−</button><button class="section-action" type="button" data-action="add" data-type="${type}" aria-label="Добавить подход">+</button></div></div><div class="table-head"><span>№</span><span>Вес, кг</span><span>Повт.</span><span>ПДО</span><span></span></div>${a.map((s,i)=>setMarkup(s,i,type)).join('')}</div>`}
function detailMarkup(e){if(e.kind!=='strength')return `<div class="exercise-body"><div class="detail-section work duration-section"><div class="section-top"><h3>Время упражнения</h3></div><label class="duration-label" for="durationMinutes">Минуты</label><div class="duration-controls ${e.durationDone?'saved':''}"><div class="duration-stepper"><button type="button" data-action="duration-step" data-dir="-1" aria-label="Уменьшить время на минуту" ${e.durationDone?'disabled':''}>−</button><input id="durationMinutes" type="text" inputmode="numeric" autocomplete="off" value="${e.minutes}" data-duration-input aria-label="Длительность упражнения в минутах" ${e.durationDone?'readonly':''}><button type="button" data-action="duration-step" data-dir="1" aria-label="Увеличить время на минуту" ${e.durationDone?'disabled':''}>+</button></div><button class="save-check ${e.durationDone?'done':''}" type="button" data-action="duration-save" aria-label="${e.durationDone?'Отменить запись времени':'Записать время'}">${checks}</button></div>${e.durationDone?'<p class="duration-unit">Время записано. Нажмите галочку, чтобы изменить.</p>':'<p class="duration-unit">От 1 до 600 минут</p>'}</div></div>`;return `<div class="exercise-body"><div class="ex-overview"><div class="motion-card"><div class="motion-illustration">${benchSvg}</div></div>${previousWorkMarkup(e)}</div>${sectionMarkup(e,'warm')}${sectionMarkup(e,'work')}</div>`}
function render(){
 const visible=activePlan(),count=visible.filter(e=>allDone(e)||e.skipped).length,widget=document.getElementById('widget'),isDetail=opened>=0;
 widget.classList.toggle('detail-mode',isDetail);
 widget.classList.remove('density-roomy','density-balanced','density-compact');
 widget.classList.add(visibleCount<=5?'density-roomy':visibleCount===6?'density-balanced':'density-compact');
 progressFill.style.width=`${count/visibleCount*100}%`;
 finish.classList.toggle('disabled',count!==visibleCount||visible.every(e=>e.skipped));
 document.getElementById('detailNav').style.display=isDetail?'flex':'none';
 list.classList.toggle('detail-view',isDetail);
 list.innerHTML=visible.map((e,i)=>{
   const done=allDone(e),isOpen=opened===i;
   if(isDetail&&!isOpen)return '';
   return `<section class="exercise ${isOpen?'open':''} ${e.skipped?'skipped':''}" data-ex="${i}">
     <button type="button" class="exercise-head" data-action="open" data-ex="${i}" aria-expanded="${isOpen}">
      <span class="ex-icon ${done?'complete':''}">${done?checks:dumbbellIcon}</span>
      <span class="ex-info"><b>${String(e.name).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</b></span>
      <span class="ex-caret"><svg viewBox="0 0 24 24"><path d="m5 9 7 7 7-7"/></svg></span>
     </button>
     ${isOpen?`<button type="button" class="skip-action" data-action="skip">${e.skipped?'Вернуть':'Пропустить'}</button>`:''}
     ${isOpen?detailMarkup(e):''}
   </section>`;
 }).join('');
}
document.getElementById('detailBack').addEventListener('click',()=>{opened=-1;render()});
const parseMinutes=raw=>{const value=raw.trim();if(!/^\d{1,3}$/.test(value))return null;const minutes=Number(value);return minutes>=1&&minutes<=600?minutes:null};
list.addEventListener('click',event=>{
 const button=event.target.closest('button[data-action]');
 if(!button||!['duration-step','duration-save'].includes(button.dataset.action))return;
 event.stopImmediatePropagation();
 if(completed||opened<0)return;
 const exercise=plan[opened];
 if(exercise.kind==='strength')return;
 const input=list.querySelector('[data-duration-input]');
 if(button.dataset.action==='duration-step'){
  if(exercise.durationDone)return;
  const current=parseMinutes(input.value)??exercise.minutes;
  exercise.minutes=Math.max(1,Math.min(600,current+Number(button.dataset.dir)));
  input.value=String(exercise.minutes);
  input.setAttribute('aria-invalid','false');
  return;
 }
 if(!exercise.durationDone){
  const minutes=parseMinutes(input.value);
  if(minutes===null){input.setAttribute('aria-invalid','true');flash('Введите целое число от 1 до 600 минут');return}
  exercise.minutes=minutes;
 }
 exercise.durationDone=!exercise.durationDone;
 if(exercise.durationDone)opened=-1;
 render();
 parent.postMessage({source:'one-rep',type:'state',plan},'*');
},true);
list.addEventListener('click',event=>{const b=event.target.closest('button[data-action]');if(!b||completed)return;const action=b.dataset.action;if(action==='open'){const i=Number(b.dataset.ex);opened=opened===i?-1:i;render();return}if(opened<0)return;if(action==='skip'){const current=plan[opened];if(!current.skipped&&(current.work.some(s=>s.done)||current.warm.some(s=>s.done)||current.durationDone)){flash('Сначала отмените записанные результаты');return}current.skipped=!current.skipped;if(current.skipped)opened=-1;render();return}const e=plan[opened],type=b.dataset.type,arr=e[type],index=Number(b.dataset.i),s=arr[index];if(action==='add'){const prev=arr.at(-1)||e.work.at(-1)||{w:20,r:12,pdo:3};arr.push({w:prev.w,r:prev.r,pdo:prev.pdo,done:false});render();return}if(action==='remove'){if(arr.length<=1)return;const candidate=arr.at(-1);if(candidate?.done){flash('Отмени сохранение последнего подхода');return}arr.pop();render();return}if(action==='step'){if(s.done){flash('Сначала отмени сохранение');return}const field=b.dataset.field,step=field==='w'?0.5:field==='pdo'?0.5:1;s[field]=Math.min(field==='w'?1000:field==='pdo'?10:100,Math.max(0,Math.round((s[field]+step*Number(b.dataset.dir))*10)/10));render();return}if(action==='save'){if(!s.done&&b.closest('.set-row').querySelector('[aria-invalid=true]')){flash('Исправь значение перед сохранением');return}s.done=!s.done;if(s.done&&allDone(e)){opened=-1;}render()}});
const thumb=document.getElementById('slideThumb'),slide=document.getElementById('finishSlide'),slideProgress=document.getElementById('slideProgress'),slideLabel=document.getElementById('slideLabel'),finishError=document.getElementById('finishError'),slideArrow=thumb.innerHTML;
let dragging=false,startX=0,startLeft=0,travel=0,slideDone=false;
function slideMove(value){const x=Math.max(0,Math.min(travel,value));thumb.style.left=(3+x)+'px';slideProgress.style.width=(x+45)+'px';return x;}
function slideReset(){thumb.style.transition='left .22s ease';slideProgress.style.transition='width .22s ease';slideMove(0);setTimeout(()=>{thumb.style.transition='';slideProgress.style.transition=''},230);}
function celebrate(){let c=document.getElementById('confetti');c.innerHTML='';for(let i=0;i<22;i++){const item=document.createElement('i');item.style.setProperty('--x',((i*43)%240-120)+'px');item.style.setProperty('--y',(40+(i*17)%110)+'px');item.style.setProperty('--r',(i*71)+'deg');item.style.setProperty('--c',['#e9e9ec','#9bdcae','#7fbd97','#d5d5dc'][i%4]);c.appendChild(item);}}
function completeWorkout(){
 if(slideDone||slide.classList.contains('disabled'))return;
 slideDone=true;completed=true;dragging=false;
 slide.classList.add('pending');slide.classList.remove('disabled');
 thumb.style.transition='left .18s ease';slideMove(travel);
 finishError.hidden=true;slideLabel.textContent='Сохраняем…';thumb.innerHTML=checks;
 parent.postMessage({source:'one-rep',type:'complete',plan},'*');
}
window.addEventListener('message',event=>{
 if(event.source!==parent||event.data?.source!=='one-rep-parent'||event.data.type!=='finish-error')return;
 slideDone=false;completed=false;slide.classList.remove('pending');
 slideLabel.textContent='Завершить тренировку';thumb.innerHTML=slideArrow;
 finishError.textContent=event.data.message||'Не удалось завершить тренировку. Повторите попытку.';
 finishError.hidden=false;slideReset();
});
thumb.addEventListener('pointerdown',e=>{
 if(slideDone||slide.classList.contains('disabled'))return;
 dragging=true;startX=e.clientX;travel=Math.max(1,slide.clientWidth-thumb.offsetWidth-6);
 startLeft=parseFloat(thumb.style.left||'3')-3;thumb.setPointerCapture(e.pointerId);
});
thumb.addEventListener('pointermove',e=>{if(!dragging)return;slideMove(startLeft+e.clientX-startX);});
thumb.addEventListener('pointerup',e=>{
 if(!dragging)return;dragging=false;
 const x=Math.max(0,Math.min(travel,startLeft+e.clientX-startX));
 if(x>=travel-9)completeWorkout();else slideReset();
});
thumb.addEventListener('pointercancel',()=>{dragging=false;slideReset()});
render();
list.addEventListener('click',()=>setTimeout(()=>parent.postMessage({source:'one-rep',type:'state',plan},'*'),0),true);

const parseSetValue=(raw,field)=>{
 const value=raw.trim().replace(',', '.');
 if(!/^\d+(?:\.\d{1,2})?$/.test(value))return null;
 const number=Number(value),maximum=field==='w'?1000:field==='r'?100:10;
 if(number>maximum||field==='r'&&!Number.isInteger(number)||field==='pdo'&&number*2!==Math.round(number*2))return null;
 return number;
};
list.addEventListener('focusin',event=>{if(event.target.matches('[data-set-input]:not([readonly])'))event.target.select()});
list.addEventListener('focusin',event=>{if(event.target.matches('[data-duration-input]:not([readonly])'))event.target.select()});
list.addEventListener('input',event=>{const input=event.target;if(input.matches('[data-duration-input]'))input.setAttribute('aria-invalid',parseMinutes(input.value)===null?'true':'false')});
list.addEventListener('change',event=>{const input=event.target;if(!input.matches('[data-duration-input]'))return;const minutes=parseMinutes(input.value);if(minutes===null){input.setAttribute('aria-invalid','true');flash('Введите целое число от 1 до 600 минут');return}plan[opened].minutes=minutes;input.value=String(minutes)});
list.addEventListener('input',event=>{
 const input=event.target;
 if(!input.matches('[data-set-input]')||opened<0||completed)return;
 const set=plan[opened]?.[input.dataset.type]?.[Number(input.dataset.i)];
 if(!set||set.done)return;
 const value=parseSetValue(input.value,input.dataset.field);
 input.setAttribute('aria-invalid',value===null?'true':'false');
 if(value!==null)set[input.dataset.field]=value;
});
list.addEventListener('change',event=>{
 const input=event.target;
 if(!input.matches('[data-set-input]')||opened<0)return;
 const set=plan[opened]?.[input.dataset.type]?.[Number(input.dataset.i)];
 if(!set||set.done)return;
 const value=parseSetValue(input.value,input.dataset.field);
 if(value===null){input.setAttribute('aria-invalid','true');flash('Проверь значение: ПДО — с шагом 0,5');return}
 input.setAttribute('aria-invalid','false');input.value=fmt(value);
});
list.addEventListener('keydown',event=>{if(event.key==='Enter'&&event.target.matches('[data-set-input],[data-duration-input]'))event.target.blur()});

</script>
<script>new ResizeObserver(()=>parent.postMessage({source:'one-rep',type:'height',height:Math.ceil(document.documentElement.scrollHeight)},'*')).observe(document.body);</script></body></html>
