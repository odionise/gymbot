    <div class="workout-mini" id="workoutMini"></div>
    <div class="summary-sub">Сравнение с прошлым результатом:</div>
  </div>
  <div class="detail-nav" id="detailNav"><button type="button" id="backBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 5-7 7 7 7"/></svg><span>Назад</span></button><span>Все упражнения</span></div>
  <div class="list" id="list"></div>
  <div id="details"></div>

</section>
<script>
const data=__SUMMARY_DATA__;
let opened=-1;
const widget=document.getElementById('widget'),list=document.getElementById('list'),details=document.getElementById('details');
const fmt=n=>Number.isInteger(n)?String(n):String(n).replace('.',',');
const esc=t=>String(t).replaceAll('&','&amp;').replaceAll('<','&lt;');
function tonnage(arr){return arr.reduce((s,x)=>s+x.w*x.r,0)}
function deltaArrow(v){return v>0?'<svg viewBox="0 0 24 24"><path d="M12 18V6m0 0-5 5m5-5 5 5"/></svg>':v<0?'<svg viewBox="0 0 24 24"><path d="M12 6v12m0 0-5-5m5 5 5-5"/></svg>':''}
function renderMini(){
 const mini=document.getElementById('workoutMini');
 mini.innerHTML='<div class="mini-head"><div>Упражнение</div><div style="text-align:right">Результат</div><div style="text-align:right">Итог</div></div>'+data.map(e=>{
   if(e.kind!=='strength'){const delta=e.pastDuration==null?null:e.duration-e.pastDuration;return `<div class="mini-row"><div class="mini-name">${esc(e.name)}</div><div class="mini-ton">${fmt(e.duration)} мин</div><div class="mini-delta ${delta>0?'up':delta<0?'down':''}">${delta==null?'':`${delta>0?'+':''}${fmt(delta)} мин`}</div></div>`}
   const cur=tonnage(e.current), hasPast=Array.isArray(e.past)&&e.past.length>0;
   if(!hasPast)return `<div class="mini-row"><div class="mini-name">${esc(e.name)}</div><div class="mini-ton">${fmt(cur)} кг</div><div class="mini-delta"></div></div>`;
   const prev=tonnage(e.past), d=Math.round((cur-prev)*10)/10;
   const cls=d>0?'up':d<0?'down':'';const sign=d>0?'+':d<0?'−':'';
   return `<div class="mini-row"><div class="mini-name">${esc(e.name)}</div><div class="mini-ton">${fmt(cur)} кг</div><div class="mini-delta ${cls}">${deltaArrow(d)}<span>${sign}${fmt(Math.abs(d))}</span></div></div>`;
 }).join('');
}
function chart(e,key,title,unit){
 const old=Array.isArray(e.past)?e.past:[],now=e.current||[];
 const hasPast=old.length>0,n=Math.max(old.length,now.length);
 const changes=Array.from({length:n},(_,i)=>{
  const pv=old[i]?.[key],cv=now[i]?.[key];
  return (pv===undefined||cv===undefined)?null:Math.round((cv-pv)*10)/10;
 });
 const largestChange=Math.max(.5,...changes.filter(v=>v!==null).map(v=>Math.abs(v)));
 const w=300,baseY=70,baseTop=40,baseHeight=baseY-baseTop;
 const centers=Array.from({length:n},(_,i)=>w*(i+.5)/n);
 const barW=Math.min(30,132/n);
 const fmtDelta=v=>(v>0?'+':'−')+fmt(Math.abs(v));
 const parts=centers.map((cx,i)=>{
   const pv=old[i]?.[key],cv=now[i]?.[key],delta=changes[i];
   const x=cx-barW/2,sideX=cx+barW/2+7;
   // When no historic set exists, draw the CURRENT result only, never a fictional previous value.
   const hasSetHistory=pv!==undefined;
   const baseTopRadius=delta>0?0:4;
   const base=`<path class="${hasSetHistory?'old-bar':'current-only'}" d="M${x} ${baseTop+baseTopRadius} Q${x} ${baseTop} ${x+baseTopRadius} ${baseTop} H${x+barW-baseTopRadius} Q${x+barW} ${baseTop} ${x+barW} ${baseTop+baseTopRadius} V${baseY-4} Q${x+barW} ${baseY} ${x+barW-4} ${baseY} H${x+4} Q${x} ${baseY} ${x} ${baseY-4}Z"/>`;
   let color='',deltaLabel='';
   if(delta!==null&&delta>0){
      const h=Math.max(8,Math.abs(delta)/largestChange*19),y=baseTop-h;
      color=`<path class="delta-pos" d="M${x} ${baseTop}V${y+4}Q${x} ${y} ${x+4} ${y}H${x+barW-4}Q${x+barW} ${y} ${x+barW} ${y+4}V${baseTop}Z"/>`;
      deltaLabel=`<text class="delta-label-pos" x="${sideX}" y="${y+h/2+3}">${fmtDelta(delta)}</text>`;
   }else if(delta!==null&&delta<0){
      const h=Math.min(baseHeight-4,Math.max(8,Math.abs(delta)/largestChange*19));
      color=`<path class="delta-neg" d="M${x} ${baseTop+h}V${baseTop+4}Q${x} ${baseTop} ${x+4} ${baseTop}H${x+barW-4}Q${x+barW} ${baseTop} ${x+barW} ${baseTop+4}V${baseTop+h}Z"/>`;
      deltaLabel=`<text class="delta-label-neg" x="${sideX}" y="${baseTop+h/2+3}">${fmtDelta(delta)}</text>`;
   }else if(delta===0){
      color=`<rect class="delta-eq" x="${x}" y="${baseTop}" width="${barW}" height="2.5"/>`;
   }
   const labelValue=hasSetHistory?pv:cv;
   const oldTxt=labelValue===undefined?'—':fmt(labelValue);
   return `${base}${color}<text class="old-label" x="${cx}" y="13">${oldTxt}</text>${deltaLabel}<text class="tick-num" x="${cx}" y="81">${i+1}</text>`;
 }).join('');
 return `<div class="chart-block"><div class="chart-heading"><strong>${title}</strong></div><div class="chart-wrap"><svg viewBox="0 0 ${w} 85" role="img" aria-label="${title}: ${hasPast?'сравнение рабочих подходов':'текущие рабочие подходы'}"><path class="gridline" d="M5 ${baseY}H295"/>${parts}</svg></div></div>`;
}
function detail(e,i){
 if(e.kind!=='strength')return `<section class="detail active"><div class="exercise-title"><h2>${esc(e.name)}</h2></div><div class="comparison"><div class="chart-heading"><strong>Время</strong></div><p>${fmt(e.duration)} мин${e.pastDuration==null?'':` · прошлый результат ${fmt(e.pastDuration)} мин`}</p></div></section>`;
 const hasPast=Array.isArray(e.past)&&e.past.length>0;
 const legend=hasPast?'<div class="legend"><span><i></i>Прошлый</span><span class="current"><i></i>Изменение</span></div>':'<div class="legend single-history"><span class="current"><i></i>Текущая тренировка</span></div>';
 return `<section class="detail ${opened===i?'active':''}"><div class="exercise-title"><h2>${esc(e.name)}</h2><span class="date">${hasPast?(e.date||''):''}</span></div><div class="comparison">${legend}${chart(e,'w','Вес','кг')}${chart(e,'r','Повторения','')}${chart(e,'p','ПДО','')}</div></section>`;
}
const go='<svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>';
function render(){
 list.innerHTML=data.map((e,i)=>`<button class="row" type="button" data-open="${i}"><span class="idx">${i+1}</span><span class="name">${esc(e.name)}</span><span class="go">${go}</span></button>`).join('');
 details.innerHTML=opened<0?'':detail(data[opened],opened);
 widget.classList.toggle('detail-mode',opened>=0);
}
list.addEventListener('click',event=>{const btn=event.target.closest('[data-open]');if(btn){opened=Number(btn.dataset.open);render()}});
document.getElementById('backBtn').addEventListener('click',()=>{opened=-1;render()});
renderMini();
render();
</script>
<script>new ResizeObserver(()=>parent.postMessage({source:'one-rep',type:'height',height:Math.ceil(document.documentElement.scrollHeight)},'*')).observe(document.body);</script></body></html>
