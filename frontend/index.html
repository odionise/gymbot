<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08090b" />
    <link rel="preload" as="image" href="/images/plate-25-v2.png" />
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      html,body,#root{margin:0;min-height:100%;background:#08090b;color:#f7f7f8}
      .bootLoader{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:29px;background:#08090b;color:#a2a2aa;font:500 14px system-ui,sans-serif;letter-spacing:.01em}
      .bootPlate{width:128px;height:128px;filter:drop-shadow(0 13px 20px #0009);animation:plateSpin 2.5s linear infinite}
      .bootPlate img{display:block;width:100%;height:100%}
      .bootLoaderText{animation:loaderBreathe 2s ease-in-out infinite}
      @keyframes plateSpin{to{transform:rotate(360deg)}}
      @keyframes loaderBreathe{50%{opacity:.55}}
      @media(prefers-reduced-motion:reduce){.bootPlate,.bootLoaderText{animation:none}}
    </style>
    <title>Тренировки</title>
  </head>
  <body>
    <div id="root"><div class="bootLoader" role="status" aria-label="Загружаем тренировку"><div class="bootPlate" aria-hidden="true"><img src="/images/plate-25-v2.png" alt="" width="128" height="128" fetchpriority="high" /></div><span class="bootLoaderText">Загружаем тренировку</span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
