<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08090b" />
    <link rel="preload" as="image" href="/images/plate-25-v2.png" />
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      html,body,#root{margin:0;min-height:100%;background:#08090b;color:#f7f7f8}
      .bootLoader{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:29px;background:#08090b;color:#a2a2aa;font:500 14px system-ui,sans-serif;letter-spacing:.01em}
      .bootPlate{width:128px;height:128px;filter:drop-shadow(0 13px 20px #0009);animation:plateSpin 2.5s linear infinite}
      .bootPlate img{display:block;width:100%;height:100%}
      .bootLoaderText{position:relative;display:block;width:260px;height:20px;text-align:center}
      .bootLoaderText span{position:absolute;inset:0;white-space:nowrap;opacity:0;clip-path:inset(0 100% 0 0);animation:bootTyping 8s linear infinite;animation-delay:var(--loader-phase,0s)}
      .bootLoaderText span:nth-child(2){animation-delay:calc(var(--loader-phase,0s) - 6s)}
      .bootLoaderText span:nth-child(3){animation-delay:calc(var(--loader-phase,0s) - 4s)}
      .bootLoaderText span:nth-child(4){animation-delay:calc(var(--loader-phase,0s) - 2s)}
      @keyframes plateSpin{to{transform:rotate(360deg)}}
      @keyframes bootTyping{0%{opacity:1;clip-path:inset(0 100% 0 0);animation-timing-function:steps(24,end)}19%{opacity:1;clip-path:inset(0 0 0 0)}24.9%{opacity:1;clip-path:inset(0 0 0 0)}25%,100%{opacity:0;clip-path:inset(0 100% 0 0)}}
      @media(prefers-reduced-motion:reduce){.bootPlate,.bootLoaderText span{animation:none}.bootLoaderText span:first-child{opacity:1;clip-path:none}}
    </style>
    <title>Тренировки</title>
  </head>
  <body>
    <div id="root"><div class="bootLoader" role="status" aria-label="Загружаем тренировки"><div class="bootPlate" aria-hidden="true"><img src="/images/plate-25-v2.png" alt="" width="128" height="128" fetchpriority="high" /></div><span class="bootLoaderText" aria-hidden="true"><span>Загружаем тренировки...</span><span>Готовим статистику...</span><span>Считаем подходы...</span><span>Корректируем программу...</span></span></div></div>
    <script>document.documentElement.style.setProperty('--loader-phase',-2*Math.floor(Math.random()*4)+'s')</script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
