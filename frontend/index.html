<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08090b" />
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      html,body,#root{margin:0;min-height:100%;background:#08090b;color:#f7f7f8}
      .bootLoader{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:29px;background:#08090b;color:#a2a2aa;font:500 14px system-ui,sans-serif;letter-spacing:.01em}
      .bootPlate{width:112px;height:112px;filter:drop-shadow(0 13px 20px #0009);animation:plateSpin 2.5s linear infinite}
      .bootPlate svg{display:block;width:100%;height:100%}
      .bootLoaderText{animation:loaderBreathe 2s ease-in-out infinite}
      @keyframes plateSpin{to{transform:rotate(360deg)}}
      @keyframes loaderBreathe{50%{opacity:.55}}
      @media(prefers-reduced-motion:reduce){.bootPlate,.bootLoaderText{animation:none}}
    </style>
    <title>Тренировки</title>
  </head>
  <body>
    <div id="root"><div class="bootLoader" role="status" aria-label="Загружаем тренировку"><div class="bootPlate" aria-hidden="true"><svg viewBox="0 0 160 160"><circle cx="80" cy="80" r="75" fill="#222226" stroke="#57575e" stroke-width="2"/><circle cx="80" cy="80" r="66" fill="none" stroke="#424249" stroke-width="7"/><circle cx="80" cy="80" r="57" fill="#29292e" stroke="#696970" stroke-width="1.5"/><path d="M36 49a54 54 0 0 1 31-22M123 110a54 54 0 0 1-31 23" fill="none" stroke="#86868d" stroke-width="2" stroke-linecap="round" opacity=".55"/><circle cx="80" cy="80" r="23" fill="#171719" stroke="#73737a" stroke-width="5"/><circle cx="80" cy="80" r="9" fill="#08090b" stroke="#92929a" stroke-width="2"/><text x="80" y="45" text-anchor="middle" fill="#f7f7f8" font-size="19" font-weight="800" letter-spacing="1">25 КГ</text><path d="M49 105h17m28 0h17" stroke="#8b8b93" stroke-width="3" stroke-linecap="round"/></svg></div><span class="bootLoaderText">Загружаем тренировку</span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
