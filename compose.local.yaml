name: workout-bot-local

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: workout
      POSTGRES_USER: workout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
    volumes:
      - pgdata_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workout -d workout"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env.local
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_DEV_TELEGRAM_ID: ${DEV_TELEGRAM_ID:-0}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./frontend/Caddyfile.local:/etc/caddy/Caddyfile:ro
    depends_on:
      - api

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [telegram]
    restart: "no"
    command: tunnel --no-autoupdate --url http://web:80
    depends_on:
      - web

volumes:
  pgdata_local:
